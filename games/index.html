<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f5">
  <meta name="description" content="Ігрова кімната Family Portal — дитячі ігри для веселих занять.">
  <title>Ігрова кімната — Family Portal</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="../">✳ Family Portal</a>
      <a class="back" href="../">← На головну</a>
    </div>
  </header>
  <main class="shell">
    <div class="intro">
      <h1>Ігрова кімната</h1>
      <p>Обирайте гру — і вирушаймо грати!</p>
    </div>
    <div class="game-grid">
      <a class="game-card" href="../hto-de-zhyve/">
        <div class="preview"><img src="./assets/who-lives-where.svg" alt="Умовна ілюстрація: лисичка й будиночок" width="480" height="300"></div>
        <div class="details"><div><h2>Хто де живе</h2><p>Знайомимося з тваринами та їхніми домівками</p></div><span class="action">Грати ↗</span></div>
      </a>
      <article class="game-card upcoming">
        <div class="preview"><img src="./assets/domino-house.svg" alt="Умовна ілюстрація: фішки доміно з будиночками" width="480" height="300"></div>
        <div class="details"><div><h2>Доміно «Будиночок»</h2><p>Настільна гра для друку</p></div><span class="action muted">Скоро</span></div>
      </article>
    </div>
    <p class="footnote">Ілюстрації карток тимчасові. Пізніше тут будуть зображення справжніх ігор.</p>
  </main>
  <footer>✳ Family Portal</footer>
</body>
